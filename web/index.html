<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mapa de Disco</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --paper:#E6EBEF; --panel:#F5F7F9; --ink:#17222E; --ink2:#4E5D6C; --line:#C3CCD5;
  --sea:#1F4E79; --sea-soft:#D5E1EC; --warn:#B3261E;
  --c0:#D9485A; --c1:#EFA63A; --c2:#8C6CC4; --c3:#3E8CD0; --c4:#93A83A; --c5:#2BA39B; --c6:#718194; --c7:#BDB7A8;
  --font:Bahnschrift,"DIN Alternate","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 var(--font);color:var(--ink);background:var(--paper);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:4px;padding:6px 12px}
button:hover{border-color:var(--sea)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
button.primary{background:var(--sea);border-color:var(--sea);color:#fff}
button.danger{border-color:var(--warn);color:var(--warn)}
button.danger:hover{background:var(--warn);color:#fff}
button:disabled{opacity:.45;cursor:default}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* Start screen */
#start{height:100%;overflow:auto;padding:48px clamp(20px,6vw,96px)}
#start h1{font-size:44px;font-weight:700;font-stretch:75%;letter-spacing:-.01em;margin:0 0 4px}
#start .lede{color:var(--ink2);max-width:60ch;margin:0 0 36px;font-size:17px}
#start h2{font-size:15px;font-weight:600;color:var(--ink2);margin:28px 0 10px}
.drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.drive{text-align:left;padding:14px 16px;background:var(--panel)}
.drive b{font-size:22px;font-stretch:75%}
.drive .bar{height:10px;background:var(--sea-soft);margin:8px 0 6px;position:relative}
.drive .bar i{position:absolute;inset:0 auto 0 0;background:var(--sea)}
.drive .bar i.full{background:var(--warn)}
.drive small{color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pathrow{display:flex;gap:8px;max-width:820px}
.pathrow input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
#browser{max-width:820px;margin-top:10px;background:var(--panel);border:1px solid var(--line);max-height:300px;overflow:auto}
#browser div{padding:6px 12px;cursor:pointer;border-bottom:1px solid var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#browser div:hover{background:var(--sea-soft)}
#browser .up{color:var(--ink2)}
#startErr{color:var(--warn);margin-top:10px;min-height:1.4em}

/* Scan in progress */
#scanning{height:100%;display:grid;place-content:center;gap:10px;padding:24px;text-align:left}
#scanning .big{font-size:64px;font-weight:700;font-stretch:75%;line-height:1}
#scanning .sub{color:var(--ink2);font-size:17px}
#scanning .cur{color:var(--ink2);max-width:min(80vw,900px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.sweep{height:4px;width:min(80vw,900px);background:var(--sea-soft);overflow:hidden}
.sweep i{display:block;height:100%;width:30%;background:var(--sea);animation:sweep 1.4s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){.sweep i{animation:none;width:100%}}

/* Map */
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 330px}
#top{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#crumbs{flex:1;display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;font-size:16px}
#crumbs button{border:0;background:none;padding:3px 5px;border-radius:3px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#crumbs button:hover{background:var(--sea-soft)}
#crumbs button.here{font-weight:700;cursor:default}
#crumbs span{color:var(--line)}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px;padding:6px 10px}
.seg button:first-child{border-radius:4px 0 0 4px;margin-left:0}
.seg button:last-child{border-radius:0 4px 4px 0}
.langrow{display:flex;justify-content:flex-end;margin-bottom:8px}
.ver{color:var(--ink2);font-size:13px;margin-top:40px}
#freeBtn[aria-pressed="true"]{background:#2E8B4E;border-color:#2E8B4E;color:#fff}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink);position:relative}
#stage{position:relative;min-width:0;min-height:0;background:var(--paper)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#over{pointer-events:none}
#clean{position:absolute;inset:0;overflow:auto;background:var(--paper);padding:22px 26px 40px}
#stage.cleanv canvas,#stage.cleanv #hud3d,#stage.cleanv #card3d,#stage.cleanv #empty{display:none!important}
#clean .intro{max-width:76ch;color:var(--ink2);margin:0 0 18px;font-size:16px}
#clean section{background:var(--panel);border:1px solid var(--line);margin-bottom:16px}
#clean header{display:flex;align-items:baseline;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#clean header h3{font-size:19px;margin:0;font-weight:700}
#clean header .tot{font-size:19px;font-weight:700;font-stretch:75%}
#clean header p{flex-basis:100%;margin:0;color:var(--ink2);font-size:14px;max-width:80ch}
#clean header .sp{flex:1}
#clean .none{padding:12px 16px;color:var(--ink2)}
.crow{display:grid;grid-template-columns:26px 6px minmax(0,1fr) auto 92px;gap:10px;align-items:center;padding:6px 16px;border-bottom:1px solid var(--paper);cursor:pointer}
.crow:hover{background:var(--sea-soft)}
.crow.sel{background:var(--sea-soft);box-shadow:inset 3px 0 0 var(--ink)}
.crow i{width:6px;align-self:stretch}
.crow b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow small{display:block;color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .dt{color:var(--ink2);font-size:13px}
.crow .sz{text-align:right;font-weight:600}
.cb{width:24px;height:24px;padding:0;border-radius:3px;line-height:1;font-size:15px;display:grid;place-content:center}
.cb.on{background:var(--warn);border-color:var(--warn);color:#fff}
.dgrp{padding:8px 16px;background:var(--paper);display:flex;gap:12px;align-items:center;font-weight:600;flex-wrap:wrap}
.dgrp .sp{flex:1}
.keep{font-size:12px;color:var(--sea);border:1px solid var(--sea);border-radius:3px;padding:0 5px;margin-left:8px;font-weight:500}
.prog{height:4px;background:var(--sea-soft);margin:0 16px 12px}.prog u{display:block;height:100%;background:var(--sea)}
#basketSec{background:#FBEDEB}
#basketSec .btot{font-size:22px;font-weight:700;font-stretch:75%;margin:2px 0 8px}
#basketSec .brow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#basketList{max-height:150px;overflow:auto;margin:0 -16px}
.bitem{display:grid;grid-template-columns:minmax(0,1fr) auto 22px;gap:8px;align-items:center;padding:3px 16px;font-size:13.5px}
.bitem span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bitem button{padding:0;width:22px;height:22px;border:0;background:none;color:var(--ink2)}
.bitem button:hover{color:var(--warn)}
.chg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:4px 16px;cursor:pointer;border:0;background:none;width:100%;text-align:left;border-radius:0}
.chg:hover{background:var(--sea-soft)}
.chg b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chg small{display:block;color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.grow{color:#A8321F;font-weight:600}.shrink{color:var(--sea);font-weight:600}
#changesList{margin:0 -16px}
#changesList p{margin:0;padding:0 16px;color:var(--ink2);font-size:14px}
#gl{display:none;cursor:crosshair}
#stage.three{background:#03050B}
#stage.three #map{display:none}
#stage.three #gl{display:block}
#hud3d{position:absolute;left:12px;bottom:10px;color:#9FE8FF;font-size:13px;line-height:1.5;pointer-events:none;text-shadow:0 0 6px #03050B,0 0 2px #03050B;max-width:60%}
#hud3d b{color:#fff;font-weight:600}
#card3d{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(3,8,18,.92);border:1px solid #37D7FF;box-shadow:0 0 18px rgba(55,215,255,.35);color:#fff;padding:14px 16px;border-radius:4px;min-width:300px;max-width:min(560px,80%)}
#card3d .nm{font-weight:700;font-size:17px;word-break:break-all;line-height:1.2}
#card3d .sz{color:#9FE8FF;margin:2px 0 10px}
#card3d .row{display:flex;gap:8px;flex-wrap:wrap}
#card3d button{background:transparent;color:#fff;border-color:#37D7FF}
#card3d button:hover{background:#37D7FF;color:#03050B}
#card3d button.danger{border-color:#FF6A5C;color:#FF9388}
#card3d button.danger:hover{background:#FF6A5C;color:#03050B}
#card3d small{display:block;color:#7FA6B8;margin-top:8px}
#empty{position:absolute;inset:0;display:grid;place-content:center;color:var(--ink2);font-size:17px;text-align:center;padding:24px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;padding:7px 10px;border-radius:4px;font-size:13.5px;max-width:420px;z-index:5;line-height:1.35}
#tip b{display:block;font-size:15px;word-break:break-all}
#tip span{opacity:.75}
#side{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
#side section{padding:14px 16px;border-bottom:1px solid var(--line)}
#side h3{font-size:14px;font-weight:600;color:var(--ink2);margin:0 0 8px}
#selName{font-size:18px;font-weight:700;word-break:break-all;line-height:1.2}
#selSize{font-size:34px;font-weight:700;font-stretch:75%;line-height:1.1;margin:6px 0 2px}
#selMeta{color:var(--ink2);font-size:13.5px;word-break:break-all}
#selActions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#selNone{color:var(--ink2)}
.cat{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:4px 6px;margin:0 -6px;border-radius:3px;cursor:pointer;border:0;background:none;width:calc(100% + 12px);text-align:left}
.cat:hover{background:var(--sea-soft)}
.cat.on{background:var(--ink);color:#fff}
.cat.off{opacity:.4}
.cat i{width:14px;height:14px;display:block}
.cat .barw{grid-column:2/4;height:3px;background:var(--line)}
.cat .barw u{display:block;height:100%;background:currentColor}
#topList{margin:0 -16px}
.trow{display:grid;grid-template-columns:6px 1fr auto;gap:8px;align-items:center;padding:5px 16px;cursor:pointer;border:0;background:none;width:100%;text-align:left;border-radius:0}
.trow:hover{background:var(--sea-soft)}
.trow i{width:6px;align-self:stretch}
.trow div{min-width:0}
.trow b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow small{display:block;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left;font-size:12px}
#status{grid-column:1/3;display:flex;gap:18px;padding:6px 12px;border-top:1px solid var(--line);background:var(--panel);font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
#status b{color:var(--ink);font-weight:600}
#status .warnc{color:var(--warn)}
dialog{border:1px solid var(--line);border-radius:6px;padding:22px 24px;max-width:480px;font:inherit;color:var(--ink);background:#fff}
dialog::backdrop{background:rgba(23,34,46,.45)}
dialog h4{margin:0 0 8px;font-size:19px}
dialog p{margin:0 0 8px;word-break:break-all}
dialog .note{color:var(--ink2);font-size:13.5px;word-break:normal}
dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:4px;z-index:9;max-width:80vw}
@media (max-width:820px){#app{grid-template-columns:1fr}#side{display:none}#top{flex-wrap:wrap}}
</style>
</head>
<body>

<div id="start">
  <div class="langrow"><div class="seg lang" role="group" aria-label="Language"><button data-lang="es">Español</button><button data-lang="en">English</button></div></div>
  <h1>Mapa de Disco</h1>
  <p class="lede" data-i18n="lede"></p>
  <h2 data-i18n="h_drives"></h2>
  <div class="drives" id="drives"></div>
  <h2 data-i18n="h_quick"></h2>
  <div class="chips" id="quick"></div>
  <h2 data-i18n="h_other"></h2>
  <div class="pathrow">
    <input id="pathIn" data-i18n-placeholder="ph_path" data-i18n-aria="aria_path" spellcheck="false">
    <button id="browseBtn" data-i18n="browse"></button>
    <button id="goBtn" class="primary" data-i18n="analyze"></button>
  </div>
  <div id="browser" class="hidden"></div>
  <div id="startErr" role="alert"></div>
  <p class="ver">v__VERSION__</p>
</div>

<div id="scanning" class="hidden">
  <div class="big num" id="scBytes">0 B</div>
  <div class="sub num" id="scCount"></div>
  <div class="sweep"><i></i></div>
  <div class="cur" id="scCur"></div>
</div>

<div id="app" class="hidden">
  <div id="top">
    <button id="upBtn" data-i18n="up" data-i18n-title="up_title"></button>
    <nav id="crumbs" data-i18n-aria="aria_crumbs"></nav>
    <div class="seg view" role="group" data-i18n-aria="view_title"><button data-view="2d" class="on" data-i18n="view_map"></button><button data-view="3d" data-i18n="view_3d" data-i18n-title="view_3d_title"></button><button data-view="clean" data-i18n="view_clean" data-i18n-title="view_clean_title"></button></div>
    <button id="freeBtn" data-i18n="free_toggle" data-i18n-title="free_title" aria-pressed="false"></button>
    <div class="seg det" role="group" data-i18n-aria="detail_title" data-i18n-title="detail_title">
      <button data-d="0" data-i18n="d0"></button><button data-d="1" class="on" data-i18n="d1"></button><button data-d="2" data-i18n="d2"></button>
    </div>
    <button id="rescanBtn" data-i18n="rescan"></button>
    <button id="changeBtn" data-i18n="change"></button>
    <div class="seg lang" role="group" aria-label="Language"><button data-lang="es">ES</button><button data-lang="en">EN</button></div>
  </div>
  <div id="stage">
    <canvas id="map"></canvas><canvas id="gl"></canvas><canvas id="over"></canvas>
    <div id="clean" class="hidden"></div>
    <div id="hud3d" class="hidden"></div>
    <div id="card3d" class="hidden"><div class="nm" id="c3name"></div><div class="sz num" id="c3size"></div><div class="row"><button id="c3reveal" data-i18n="reveal"></button><button id="c3trash" class="danger" data-i18n="trash"></button><button id="c3basket"></button></div><small data-i18n="card_hint"></small></div>
    <div id="empty" class="hidden" data-i18n="empty"></div>
  </div>
  <aside id="side">
    <section>
      <div id="selNone" data-i18n="sel_none"></div>
      <div id="sel" class="hidden">
        <div id="selName"></div>
        <div id="selSize" class="num"></div>
        <div id="selMeta"></div>
        <div id="selActions">
          <button id="enterBtn" data-i18n="enter"></button>
          <button id="revealBtn" data-i18n="reveal"></button>
          <button id="trashBtn" class="danger" data-i18n="trash"></button>
          <button id="basketBtn"></button>
        </div>
      </div>
    </section>
    <section id="basketSec" class="hidden">
      <h3 id="basketTitle"></h3>
      <div class="btot num" id="basketTotal"></div>
      <div class="brow"><button id="basketTrash" class="danger" data-i18n="basket_trash"></button><button id="basketClear" data-i18n="basket_clear"></button></div>
      <div id="basketList"></div>
    </section>
    <section>
      <h3 data-i18n="h_types"></h3>
      <div id="legend"></div>
    </section>
    <section>
      <h3 id="changesTitle"></h3>
      <div id="changesList"></div>
    </section>
    <section>
      <h3 id="topTitle"></h3>
      <div id="topList"></div>
    </section>
  </aside>
  <div id="status"></div>
</div>

<div id="tip" class="hidden"></div>
<div id="toast" class="hidden" role="status"></div>
<dialog id="dlg">
  <h4 id="dlgTitle" data-i18n="dlg_title"></h4>
  <p id="dlgWhat"></p>
  <p class="note" data-i18n="dlg_note"></p>
  <div class="row"><button id="dlgNo" data-i18n="cancel"></button><button id="dlgYes" class="danger" data-i18n="trash"></button></div>
</dialog>

const $ = id => document.getElementById(id);

  const btn = e.target.closest("[data-act]"), row = e.target.closest(".crow");
  if (btn && btn.dataset.act === "basket") { basketToggle(cleanItems[btn.dataset.i]); return; }
  if (btn && btn.dataset.act === "addall") { const [a, b] = cleanGroups[btn.dataset.k] || [0, 0]; for (let i = a; i < b; i++) if (!basketCovers(cleanItems[i].path)) basketToggle(cleanItems[i], true); basketUI(); return; }
  if (btn && btn.dataset.act === "dupfind") { try { await api("/api/dups", {path: viewPath}); } catch (er) { toast(er.message); } loadClean(); return; }
  if (row) select(cleanItems[row.dataset.i]);
});
$("freeBtn").setAttribute("aria-pressed", showFree);
$("freeBtn").onclick = () => {
  showFree = !showFree; try { localStorage.setItem("mapadisco.free", showFree ? "1" : "0"); } catch {}
  $("freeBtn").setAttribute("aria-pressed", showFree);
  if (showFree && viewPath !== scanRoot) toast(t("free_root"));
  go(viewPath, true);
};
document.querySelectorAll(".view button").forEach(b => b.onclick = () => setView(b.dataset.view));
document.querySelectorAll(".det button").forEach(b => b.onclick = () => { detail = +b.dataset.d; document.querySelectorAll(".det button").forEach(x => x.classList.toggle("on", x === b)); go(viewPath, true); });
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
applyLang();
$("rescanBtn").onclick = () => scan(scanRoot);
$("changeBtn").onclick = () => { show("start"); loadPlaces(); };

(async function init() {
  try { const s = await api("/api/status"); SEP = s.sep; if (s.state !== "idle") { show(s.state === "scanning" ? "scanning" : "app"); poll(); return; } } catch {}
  loadPlaces();
})();
</script>
</body>
</html>
